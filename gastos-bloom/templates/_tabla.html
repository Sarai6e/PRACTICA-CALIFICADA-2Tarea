{% if gastos %}<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Descripción</th><th class="amount">Monto</th></tr></thead><tbody>{% for gasto in gastos %}<tr><td class="date">{{ gasto.fecha }}</td><td>{{ gasto.descripcion }}</td><td class="amount">{{ gasto.centimos | soles }}</td></tr>{% endfor %}</tbody></table></div>{% else %}<div class="empty"><span>✿</span><h3>No hay gastos en este listado</h3><p>Registra tu primer gasto o revisa el filtro de fechas.</p></div>{% endif %}
